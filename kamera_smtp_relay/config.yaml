name: "AlarmCam Analyse und Mail-Relay"
version: "1.1.4"
slug: "kamera_smtp_relay"
description: "Zentrale Alarmmail-Verwaltung für Kameras mit Bildanalyse und selektiver Weiterleitung."
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
ingress: true
ingress_port: 8099
panel_icon: "mdi:email-fast-outline"
panel_title: "AlarmCam"
map:
  - type: ssl
    read_only: true
  - type: share
    read_only: false
options:
  photo_storage: true
  forward_enabled: true
  detect_enabled: true
  detect_only_forward: false
  relay_user: ""
  relay_password: ""
  target_host: "smtp.revierspion.de"
  target_port: 25
  target_user: "revierspion"
  target_password: ""
  allowed_domains: "revierspion.de"
  target_sender: ""
  backup_host: ""
  backup_port: 587
  backup_user: ""
  backup_password: ""
  backup_sender: ""
  throttle_minutes: 1
  send_delay_seconds: 3
  retry_minutes: 30
  retention_days: 180
  storage_mb: 1024
  detect_threads: 1
  detect_threshold_tier: 25
  detect_threshold_mensch: 30
  detect_threshold_fahrzeug: 30
schema:
  photo_storage: bool
  forward_enabled: bool
  detect_enabled: bool
  detect_only_forward: bool
  relay_port: port
  relay_user: str
  relay_password: password
  target_host: str
  target_port: port
  target_user: str
  target_password: password
  allowed_domains: str
  target_sender: str
  backup_host: str
  backup_port: port
  backup_user: str
  backup_password: password
  backup_sender: str
  throttle_minutes: "int(0,1440)"
  send_delay_seconds: "int(0,300)"
  retry_minutes: "int(0,1440)"
  retention_days: "int(1,3650)"
  storage_mb: "int(50,1000000)"
  detect_threads: "int(1,4)"
  detect_threshold_tier: "int(10,95)"
  detect_threshold_mensch: "int(10,95)"
  detect_threshold_fahrzeug: "int(10,95)"
