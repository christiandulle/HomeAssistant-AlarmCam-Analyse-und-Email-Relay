configuration:
  photo_storage:
    name: "1 Funktionen: Fotos auf dem Share ablegen"
    description: Standard an. Alle Fotos werden unter /share/kamera_relay/<Revier>/<Kamera>/ abgelegt und im Board angezeigt. Aus = reines Relay - dann bleiben nur Fotos erhalten, die nicht weitergeleitet wurden (gedrosselt, gescheitert, ohne Erkennung, Weiterleitung aus), damit sie im Board erneut gesendet werden können. Weitergeleitete Fotos werden danach gelöscht.
  forward_enabled:
    name: "1 Funktionen: Fotos an das Ziel weiterleiten"
    description: Standard an. Aus = nichts wird weitergeleitet, alle Fotos werden nur gespeichert und lassen sich im Board einzeln neu senden. Die Einstellungen für Ziel- und Backup-Server werden dann nicht benutzt.
  detect_enabled:
    name: "1 Funktionen: Bilderkennung (Tier / Mensch / Fahrzeug / leer)"
    description: Standard an. Jedes Foto wird lokal auf dem Gerät geprüft und als Mensch, Tier, Fahrzeug oder leer markiert. Die Erkennung markiert nur, sie hält nichts zurück (außer die nächste Einstellung ist an).
  detect_only_forward:
    name: "1 Funktionen: Nur Fotos mit Erkennung weiterleiten"
    description: Standard aus. An = Fotos, auf denen nichts erkannt wurde, werden nicht weitergeleitet, sondern im Board gespeichert (Status "ohne Erkennung", dort neu sendbar). Wirkt nur, wenn die Bilderkennung an ist.
  relay_port:
    name: "2 Relay: Port (Pflichtfeld)"
    description: Frei wählbarer Port, auf dem das Relay am Home Assistant auf die Kameras wartet, z. B. 20023. Dieselbe Nummer am Router von außen auf den Home Assistant weiterleiten und in jeder Kamera als SMTP-Port eintragen. Viele Provider sperren Port 25, nimm besser eine hohe Nummer (über 1024).
  relay_user:
    name: "2 Relay: Benutzer"
    description: Wird in allen Kameras als Absenderadresse eingetragen und dient als Login. Reolink verlangt eine Adresse mit @, z. B. kamera@meinedomain.at.
  relay_password:
    name: "2 Relay: Passwort"
    description: Frei wählbar, mindestens 12 Zeichen. Wird in allen Kameras als Passwort eingetragen.
  target_host:
    name: "3 Ziel-SMTP: Server"
    description: Server, an den jede Mail weitergereicht wird (voreingestellt RevierSpion). Die Verschlüsselung wird automatisch gewählt (SSL/TLS bei Port 465, STARTTLS bei 587, sonst unverschlüsselt).
  target_port:
    name: "3 Ziel-SMTP: Port"
    description: 25 bei RevierSpion, 587 oder 465 bei GMX, Gmail und ähnlichen.
  target_user:
    name: "3 Ziel-SMTP: Benutzername"
  target_password:
    name: "3 Ziel-SMTP: Passwort"
  allowed_domains:
    name: "3 Ziel-SMTP: Erlaubte Empfänger-Domains"
    description: Domain der Empfängeradressen der Kameras, z. B. revierspion.de. Mehrere mit Komma trennen. Mails an andere Domains werden abgelehnt. Bei einem Zwischenserver wie GMX oder Gmail muss hier trotzdem revierspion.de stehen.
  target_sender:
    name: "3 Ziel-SMTP: Absender"
    description: Leer lassen = der Absender der Kamera wird unverändert weitergegeben (z. B. bei RevierSpion direkt). Bei GMX, Gmail & Co. hier die Adresse des Kontos eintragen. Dann wird auch der From-Kopf der Mail ersetzt, die Kamera-Adresse bleibt als Reply-To erhalten. Gilt für den Hauptserver, beim Backup-Server nur, wenn dort kein eigener Absender eingetragen ist.
  backup_host:
    name: "4 Backup-SMTP: Server"
    description: Optional. Zweiter Zielserver, z. B. smtp-relay.brevo.com. Schlägt eine Zustellung beim Hauptserver fehl, geht der nächste Versuch sofort über diesen Server. Leer lassen = kein Backup.
  backup_port:
    name: "4 Backup-SMTP: Port"
    description: 587 (mit STARTTLS, Standard) oder 465 (SSL/TLS). Die Verschlüsselung wird automatisch gewählt.
  backup_user:
    name: "4 Backup-SMTP: Benutzer"
    description: Anmeldename beim Backup-Server (bei Brevo die Login-Adresse des SMTP-Zugangs).
  backup_password:
    name: "4 Backup-SMTP: Passwort"
    description: Passwort beim Backup-Server (bei Brevo der SMTP-Schlüssel, nicht das Kontopasswort).
  backup_sender:
    name: "4 Backup-SMTP: Absender"
    description: 'Absenderadresse beim Backup-Server (bei Brevo eine dort bestätigte Adresse). Leer lassen = derselbe Absender wie bei "Ziel-SMTP: Absender".'
  throttle_minutes:
    name: "5 Zustellung: Drosselung pro Kamera (Minuten)"
    description: Pro Kamera wird höchstens ein Foto in diesem Zeitraum weitergeleitet (Standard 1). Weitere Fotos werden gespeichert und sind im Board neu sendbar. 0 = keine Drosselung.
  send_delay_seconds:
    name: "5 Zustellung: Wartezeit zwischen zwei Mails (Sekunden)"
    description: So lange wartet das Relay nach jeder zugestellten Mail, bevor die nächste zum Ziel geht (Standard 3). Schützt vor Sperren durch den Ziel-Anbieter.
  retry_minutes:
    name: "5 Zustellung: Wiederholen bei Fehlern (Minuten)"
    description: So lange versucht das Relay eine Mail zuzustellen, bevor sie als gescheitert gilt (Standard 30). Gescheiterte Fotos bleiben im Board zum erneuten Senden.
  retention_days:
    name: "6 Fotospeicher: Aufbewahrung (Tage)"
    description: So lange bleiben alle Fotos samt Status im Board gespeichert, auch gedrosselte, gescheiterte und nicht erkannte (Standard 180). Danach werden sie automatisch gelöscht. Favoriten bleiben immer erhalten.
  storage_mb:
    name: "6 Fotospeicher: Speicherlimit (MB)"
    description: Maximaler Platz für die Fotos im Board (Standard 1024 = 1 GB). Ist er voll, wird das jeweils älteste Foto gelöscht (Favoriten bleiben) und das Board zeigt einen Hinweis.
  detect_threads:
    name: "7 Bilderkennung: Threads"
    description: Wie viele CPU-Kerne die Erkennung höchstens nutzt (Standard 1, höchstens 4). Mehr Threads erkennen schneller, belasten Home Assistant aber stärker. Die Erkennung läuft immer mit der niedrigsten Priorität.
  detect_threshold_tier:
    name: "7 Bilderkennung: Schwelle Tier (%)"
    description: Ab dieser Sicherheit zählt ein Tier (Standard 25). Niedriger findet mehr, auch mehr Falsches.
  detect_threshold_mensch:
    name: "7 Bilderkennung: Schwelle Mensch (%)"
    description: Ab dieser Sicherheit zählt ein Mensch (Standard 30).
  detect_threshold_fahrzeug:
    name: "7 Bilderkennung: Schwelle Auto/Fahrzeug (%)"
    description: Ab dieser Sicherheit zählt ein Fahrzeug (Standard 30). Höher, wenn Wild oder Schatten fälschlich als Fahrzeug erkannt werden.
